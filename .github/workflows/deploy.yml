name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-arch:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.detect.outputs.arch }}
      runner: ${{ steps.detect.outputs.runner }}
    steps:
      - name: Detect VM architecture via SSH
        id: detect
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          UNAME=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_key "$VPS_USER@$VPS_HOST" uname -m)
          case "$UNAME" in
            x86_64)
              echo "arch=amd64" >> $GITHUB_OUTPUT
              echo "runner=ubuntu-24.04" >> $GITHUB_OUTPUT
              ;;
            aarch64)
              echo "arch=arm64" >> $GITHUB_OUTPUT
              echo "runner=ubuntu-24.04-arm" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unsupported VM arch: $UNAME"
              exit 1
              ;;
          esac

  build-and-push:
    needs: detect-arch
    runs-on: ${{ needs.detect-arch.outputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      healthcheck_image: ${{ steps.image.outputs.healthcheck }}
      monitor_auth_image: ${{ steps.image.outputs.monitor_auth }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        id: image
        run: |
          BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$BASE" >> $GITHUB_OUTPUT
          echo "healthcheck=${BASE}-healthcheck" >> $GITHUB_OUTPUT
          echo "monitor_auth=${BASE}-monitor-auth" >> $GITHUB_OUTPUT

      - name: Download binary for ${{ needs.detect-arch.outputs.arch }}
        run: |
          gh release download --pattern "telegram-bot-api-${{ needs.detect-arch.outputs.arch }}" --output telegram-bot-api
          chmod +x telegram-bot-api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push telegram-bot-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Build and push healthcheck
        uses: docker/build-push-action@v6
        with:
          context: ./healthcheck
          push: true
          tags: |
            ${{ steps.image.outputs.healthcheck }}:latest
            ${{ steps.image.outputs.healthcheck }}:${{ github.sha }}

      - name: Build and push monitor-auth
        uses: docker/build-push-action@v6
        with:
          context: ./monitor-auth
          push: true
          tags: |
            ${{ steps.image.outputs.monitor_auth }}:latest
            ${{ steps.image.outputs.monitor_auth }}:${{ github.sha }}

  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i "${{ secrets.VPS_HOST }}," \
            -u "${{ secrets.VPS_USER }}" \
            --private-key /tmp/ssh_key \
            --ssh-extra-args="-o StrictHostKeyChecking=no" \
            ansible/playbook.yml

  dns-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all domains resolve to the VPS IP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOMAINS: ${{ secrets.VPS_DOMAINS }}
          MONITOR_DOMAIN: ${{ vars.MONITOR_DOMAIN }}
        run: ./scripts/dns-check.sh

  deploy:
    needs: [build-and-push, provision, dns-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Encode configs
        id: configs
        run: |
          echo "compose=$(base64 -w0 docker-compose.yml)" >> $GITHUB_OUTPUT
          echo "composeproxy=$(base64 -w0 docker-compose.proxy.yml)" >> $GITHUB_OUTPUT
          echo "caddyfile=$(base64 -w0 Caddyfile)" >> $GITHUB_OUTPUT
          echo "netdataconf=$(base64 -w0 netdata.conf)" >> $GITHUB_OUTPUT

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          HEALTHCHECK_IMAGE: ${{ needs.build-and-push.outputs.healthcheck_image }}:latest
          MONITOR_AUTH_IMAGE: ${{ needs.build-and-push.outputs.monitor_auth_image }}:latest
          DOMAINS: ${{ secrets.VPS_DOMAINS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          MONITOR_USER: ${{ secrets.MONITOR_USER }}
          MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
          MONITOR_DOMAIN: ${{ vars.MONITOR_DOMAIN }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
          COMPOSE_B64: ${{ steps.configs.outputs.compose }}
          COMPOSE_PROXY_B64: ${{ steps.configs.outputs.composeproxy }}
          CADDYFILE_B64: ${{ steps.configs.outputs.caddyfile }}
          NETDATA_CONF_B64: ${{ steps.configs.outputs.netdataconf }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,HEALTHCHECK_IMAGE,MONITOR_AUTH_IMAGE,DOMAINS,API_TOKEN,TELEGRAM_API_ID,TELEGRAM_API_HASH,TEST_BOT_TOKEN,TEST_CHAT_ID,MONITOR_USER,MONITOR_PASSWORD,MONITOR_DOMAIN,PROXY_NETWORK,COMPOSE_B64,COMPOSE_PROXY_B64,CADDYFILE_B64,NETDATA_CONF_B64
          script_path: scripts/deploy-remote.sh

      - name: Health check
        env:
          DOMAINS: ${{ secrets.VPS_DOMAINS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: ./scripts/health-check.sh

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TEXT="✅ Deploy successful
          https://github.com/MaxSiominDev/TgBotApi/"
          else
            TEXT="❌ Deploy failed
          https://github.com/MaxSiominDev/TgBotApi/ (build: $BUILD_RESULT, deploy: $DEPLOY_RESULT)"
          fi

          TEXT="$TEXT"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -F "chat_id=${CHAT_ID}" \
            -F "text=${TEXT}"
