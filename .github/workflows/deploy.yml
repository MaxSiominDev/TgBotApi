name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-arch:
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.detect.outputs.arch }}
      runner: ${{ steps.detect.outputs.runner }}
    steps:
      - name: Detect VM architecture via SSH
        id: detect
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          UNAME=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_key "$VPS_USER@$VPS_HOST" uname -m)
          case "$UNAME" in
            x86_64)
              echo "arch=amd64" >> $GITHUB_OUTPUT
              echo "runner=ubuntu-24.04" >> $GITHUB_OUTPUT
              ;;
            aarch64)
              echo "arch=arm64" >> $GITHUB_OUTPUT
              echo "runner=ubuntu-24.04-arm" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unsupported VM arch: $UNAME"
              exit 1
              ;;
          esac

  build-and-push:
    needs: detect-arch
    runs-on: ${{ needs.detect-arch.outputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      healthcheck_image: ${{ steps.image.outputs.healthcheck }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        id: image
        run: |
          BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$BASE" >> $GITHUB_OUTPUT
          echo "healthcheck=${BASE}-healthcheck" >> $GITHUB_OUTPUT

      - name: Download binary for ${{ needs.detect-arch.outputs.arch }}
        run: |
          gh release download --pattern "telegram-bot-api-${{ needs.detect-arch.outputs.arch }}" --output telegram-bot-api
          chmod +x telegram-bot-api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push telegram-bot-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Build and push healthcheck
        uses: docker/build-push-action@v6
        with:
          context: ./healthcheck
          push: true
          tags: |
            ${{ steps.image.outputs.healthcheck }}:latest
            ${{ steps.image.outputs.healthcheck }}:${{ github.sha }}

  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i "${{ secrets.VPS_HOST }}," \
            -u "${{ secrets.VPS_USER }}" \
            --private-key /tmp/ssh_key \
            --ssh-extra-args="-o StrictHostKeyChecking=no" \
            ansible/playbook.yml

  deploy:
    needs: [build-and-push, provision]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Encode configs
        id: configs
        run: |
          echo "compose=$(base64 -w0 docker-compose.yml)" >> $GITHUB_OUTPUT
          echo "caddyfile=$(base64 -w0 Caddyfile)" >> $GITHUB_OUTPUT

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:latest
          HEALTHCHECK_IMAGE: ${{ needs.build-and-push.outputs.healthcheck_image }}:latest
          DOMAINS: ${{ secrets.VPS_DOMAINS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          COMPOSE_B64: ${{ steps.configs.outputs.compose }}
          CADDYFILE_B64: ${{ steps.configs.outputs.caddyfile }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,HEALTHCHECK_IMAGE,DOMAINS,API_TOKEN,TELEGRAM_API_ID,TELEGRAM_API_HASH,TEST_BOT_TOKEN,TEST_CHAT_ID,COMPOSE_B64,CADDYFILE_B64
          script: |
            mkdir -p /opt/telegram-bot-api
            cd /opt/telegram-bot-api

            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
            echo "$CADDYFILE_B64" | base64 -d > Caddyfile

            {
              printf 'IMAGE=%s\n' "$IMAGE"
              printf 'HEALTHCHECK_IMAGE=%s\n' "$HEALTHCHECK_IMAGE"
              printf 'DOMAINS=%s\n' "$DOMAINS"
              printf 'API_TOKEN=%s\n' "$API_TOKEN"
              printf 'TEST_BOT_TOKEN=%s\n' "$TEST_BOT_TOKEN"
              printf 'TEST_CHAT_ID=%s\n' "$TEST_CHAT_ID"
            } > .env
            printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
              "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > .env.api

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Health check
        env:
          DOMAINS: ${{ secrets.VPS_DOMAINS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -e
          MAX_ATTEMPTS=120  # 120 * 5s = 10 minutes

          probe() {
            local url=$1 attempts=$2 auth=$3
            local i=1 code ok
            local hdr=()
            if [ "$auth" = "auth" ]; then hdr=(-H "X-Api-Token: $API_TOKEN"); fi
            while :; do
              code=$(curl -sS "${hdr[@]}" -o /tmp/body -w '%{http_code}' "$url" || echo "000")
              ok=$(jq -r '.ok // false' /tmp/body 2>/dev/null || echo "false")
              if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
                echo "  OK (attempt $i): $(cat /tmp/body)"
                return 0
              fi
              if [ "$i" -ge "$attempts" ]; then
                echo "  FAILED after $i attempts: code=$code"
                cat /tmp/body || true
                return 1
              fi
              i=$((i+1))
              sleep 5
            done
          }

          for d in $DOMAINS; do
            # containers — ждём пока стек поднимется, остальные — без ретраев.
            echo "[$d] containers"
            probe "https://$d/health/containers" "$MAX_ATTEMPTS" noauth \
              || { echo "::error::healthcheck failed: domain=$d check=containers"; exit 1; }

            echo "[$d] telegram"
            probe "https://$d/health/telegram" 1 auth \
              || { echo "::error::healthcheck failed: domain=$d check=telegram"; exit 1; }

            echo "[$d] send-message"
            probe "https://$d/health/send-message" 1 auth \
              || { echo "::error::healthcheck failed: domain=$d check=send-message"; exit 1; }
          done

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            TEXT="✅ Deploy successful
          https://github.com/MaxSiominDev/TgBotApi/"
          else
            TEXT="❌ Deploy failed
          https://github.com/MaxSiominDev/TgBotApi/ (build: $BUILD_RESULT, deploy: $DEPLOY_RESULT)"
          fi

          TEXT="$TEXT"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -F "chat_id=${CHAT_ID}" \
            -F "text=${TEXT}"
