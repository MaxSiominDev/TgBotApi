services:
  telegram-bot-api:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env.api
    volumes:
      - ./data:/data

  healthcheck:
    image: ${HEALTHCHECK_IMAGE}
    restart: unless-stopped
    environment:
      - TEST_BOT_TOKEN=${TEST_BOT_TOKEN}
      - TEST_CHAT_ID=${TEST_CHAT_ID}
      - HEALTH_TOKEN=${API_TOKEN}
      - COMPOSE_PROJECT=telegram-bot-api
      - LOCAL_TG_API=http://telegram-bot-api:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - telegram-bot-api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAINS=${DOMAINS}
      - API_TOKEN=${API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - telegram-bot-api
      - healthcheck

volumes:
  caddy_data:
  caddy_config:
